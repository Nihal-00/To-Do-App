trigger:
- main

stages:

# =========================
# BUILD
# =========================

- stage: Build
  displayName: Build
  jobs:
  - job: Build
    displayName: Build
    steps:

    - checkout: self
      displayName: "Checkout repository"

    - task: UsePythonVersion@0
      displayName: "Set up Python"
      inputs:
        versionSpec: "3.x"

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      displayName: "Restore dependencies"

    - script: |
        python -m compileall .
      displayName: "Build"

    - script: |
        pip install pytest
        pytest --junitxml=test-results.xml
      displayName: "Run Tests"

    - task: PublishTestResults@2
      displayName: "Publish Test Results"
      inputs:
        testResultsFormat: "JUnit"
        testResultsFiles: "**/test-results.xml"
        failTaskOnFailedTests: true

# =========================
# DEV
# =========================

- stage: Dev
  displayName: Deploy to Dev
  dependsOn: Build
  condition: succeeded()

  jobs:
  - deployment: DeployDev
    displayName: Deploy to Dev
    environment: dev

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self
            displayName: "Checkout repository"

          - script: |
              echo "Current directory:"
              pwd

              echo "Repository contents:"
              find $(Build.SourcesDirectory) -maxdepth 3 -type f | sort

              echo "Kubernetes manifests:"
              ls -la $(Build.SourcesDirectory)/k8s || true
            displayName: "Check Kubernetes manifests"

          - task: KubernetesManifest@1
            displayName: "Deploy to AKS - Dev"
            inputs:
              action: deploy
              connectionType: azureResourceManager
              azureSubscriptionConnection: "todo-aks-connection"
              azureResourceGroup: "todo-aks-rg"
              kubernetesCluster: "todo-aks"
              manifests: |
                k8s/deployment.yaml
                k8s/service.yaml

# =========================
# STAGING
# =========================

- stage: Staging
  displayName: Deploy to Staging
  dependsOn: Dev
  condition: succeeded()

  jobs:
  - deployment: DeployStaging
    displayName: Deploy to Staging
    environment: staging

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self
            displayName: "Checkout repository"

          - script: |
              echo "Current directory:"
              pwd

              echo "Kubernetes manifests:"
              ls -la $(Build.SourcesDirectory)/k8s || true
            displayName: "Check Kubernetes manifests"

          - task: KubernetesManifest@1
            displayName: "Deploy to AKS - Staging"
            inputs:
              action: deploy
              connectionType: azureResourceManager
              azureSubscriptionConnection: "todo-aks-connection"
              azureResourceGroup: "todo-aks-rg"
              kubernetesCluster: "todo-aks"
              manifests: |
                k8s/deployment.yaml
                k8s/service.yaml