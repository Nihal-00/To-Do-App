services:

  app:
    build: .
    container_name: todo-app

    env_file:
      - .env

    expose:
      - "5000"

    depends_on:
      - mysql

    networks:
      - todo-network

  mysql:
    image: mysql:8.0

    container_name: mysql-db

    restart: always

    env_file:
      - .env

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - todo-network

  nginx:
    image: nginx:latest

    container_name: nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - todo-network

volumes:
  mysql_data:

networks:
  todo-network:
